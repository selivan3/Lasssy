<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasssy V4 - Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 280px;
            background: #16213e;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.1em;
            color: #e94560;
        }

        .section {
            background: #0f3460;
            padding: 10px;
            border-radius: 6px;
        }

        .section h3 {
            font-size: 0.7em;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            width: 100%;
            margin-bottom: 4px;
        }

        .btn:hover {
            background: #ff6b6b;
        }

        .btn-secondary {
            background: #0f3460;
            border: 1px solid #e94560;
        }

        .btn-green {
            background: #27ae60;
        }

        .class-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 3px;
            font-size: 0.8em;
        }

        .class-row.target {
            box-shadow: 0 0 0 2px #fff;
        }

        .class-row .count {
            margin-left: auto;
            font-size: 0.7em;
            opacity: 0.7;
        }

        .class-2 {
            background: #8B4513;
        }

        .class-3 {
            background: #90EE90;
            color: #000;
        }

        .class-4 {
            background: #32CD32;
        }

        .class-5 {
            background: #006400;
        }

        .class-6 {
            background: #FF6347;
        }

        .class-7 {
            background: #808080;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8em;
            max-width: 280px;
        }

        .highlight {
            color: #e94560;
            font-weight: bold;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75em;
            margin: 5px 0;
        }

        .slider-row label {
            flex: 1;
            min-width: 80px;
        }

        .slider-row input[type="range"] {
            width: 70px;
        }

        .slider-row .val {
            color: #e94560;
            width: 35px;
            text-align: right;
        }

        .hotkeys {
            font-size: 0.65em;
            color: #666;
            line-height: 1.4;
        }

        .hotkeys kbd {
            background: #333;
            padding: 1px 4px;
            border-radius: 2px;
        }

        .file-input {
            display: none;
        }

        #display-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75em;
            min-width: 180px;
        }

        #display-panel h4 {
            color: #e94560;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        #perf-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding-top: 8px;
            margin-top: 8px;
            border-top: 1px solid #333;
            color: #888;
        }

        #perf-toggle:hover {
            color: #e94560;
        }

        #perf-content {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #333;
        }

        #perf-content.show {
            display: block;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }

        .stat span:last-child {
            color: #e94560;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="sidebar">
            <h1>🎯 Lasssy V4</h1>

            <div class="section">
                <h3>Файл</h3>
                <input type="file" id="fileInput" class="file-input" accept=".xyz,.txt">
                <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Загрузить</button>
            </div>

            <div class="section">
                <h3>Сегментация (Region Growing)</h3>
                <div class="slider-row">
                    <label>Радиус:</label>
                    <input type="range" id="segRadius" min="0.5" max="15" step="0.5" value="3"
                        onchange="updateSegParams()">
                    <span class="val" id="segRadiusVal">3</span>
                </div>
                <div class="slider-row">
                    <label>Мин. точек:</label>
                    <input type="range" id="segMinPts" min="1" max="100" step="1" value="3"
                        onchange="updateSegParams()">
                    <span class="val" id="segMinPtsVal">3</span>
                </div>
                <div class="slider-row">
                    <label>По классу:</label>
                    <input type="checkbox" id="segByClass" checked onchange="updateSegParams()">
                </div>
                <div class="slider-row">
                    <label>Не ниже грунта:</label>
                    <input type="checkbox" id="segStopGround" checked onchange="updateSegParams()">
                </div>
                <div class="slider-row">
                    <label>Макс. ΔZ:</label>
                    <input type="range" id="segMaxDZ" min="0.5" max="10" step="0.5" value="2"
                        onchange="updateSegParams()">
                    <span class="val" id="segMaxDZVal">2</span>
                </div>
            </div>

            <div class="section">
                <h3>Целевой класс</h3>
                <div id="classRows"></div>
            </div>

            <div class="section">
                <h3>Действия</h3>
                <button class="btn btn-green" onclick="applyClass()">✓ Применить (Enter)</button>
                <button class="btn btn-secondary" onclick="clearSelection()">✕ Снять выделение</button>
                <button class="btn btn-secondary" onclick="saveFile()">💾 Сохранить</button>
            </div>

            <div class="section">
                <h3>Управление</h3>
                <div class="hotkeys">
                    <kbd>ЛКМ</kbd> Выделить сегмент<br>
                    <kbd>Shift+ЛКМ</kbd> Добавить<br>
                    <kbd>2-7</kbd> Класс | <kbd>Enter</kbd> Применить
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="info">Загрузите XYZ файл</div>

            <div id="display-panel">
                <h4>⚙️ Отображение</h4>
                <div class="slider-row">
                    <label>Макс. точек:</label>
                    <input type="range" id="maxPoints" min="50000" max="500000" step="50000" value="200000"
                        onchange="updateDisplay()">
                    <span class="val" id="maxPtsVal">200K</span>
                </div>
                <div class="slider-row">
                    <label>Размер:</label>
                    <input type="range" id="pointSize" min="0.2" max="3" step="0.1" value="0.5"
                        onchange="updatePointSize()">
                    <span class="val" id="ptSizeVal">0.5</span>
                </div>
                <div id="perf-toggle" onclick="togglePerf()">
                    <span>📊 Подробнее</span><span id="perf-arrow">▼</span>
                </div>
                <div id="perf-content">
                    <div class="stat"><span>Всего:</span><span id="statTotal">-</span></div>
                    <div class="stat"><span>Показано:</span><span id="statDisplay">-</span></div>
                    <div class="stat"><span>Сегментов:</span><span id="statSegs">-</span></div>
                    <div class="stat"><span>Сегментац.:</span><span id="statSeg">-</span></div>
                    <div class="stat"><span>FPS:</span><span id="statFps">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let allPoints = [], displayPoints = [], segments = [];
        let pointCloud = null, selectedIndices = new Set();
        let targetClass = 6, centerOffset = { x: 0, y: 0 };
        let maxDisplayPoints = 200000;
        let isFirstLoad = true;
        let lastTime = performance.now(), frameCount = 0;

        const classColors = { 1: 0xffffff, 2: 0x8B4513, 3: 0x90EE90, 4: 0x32CD32, 5: 0x006400, 6: 0xFF6347, 7: 0x808080 };
        const classNames = { 2: 'Грунт', 3: 'Низкая', 4: 'Средняя', 5: 'Высокая', 6: 'Здания', 7: 'Шум' };

        function togglePerf() {
            const c = document.getElementById('perf-content');
            const a = document.getElementById('perf-arrow');
            c.classList.toggle('show');
            a.textContent = c.classList.contains('show') ? '▲' : '▼';
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 10000);
            camera.position.set(50, 50, 50);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: false });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = 1.5;
            mouse = new THREE.Vector2();
            scene.add(new THREE.GridHelper(200, 20, 0x444444, 0x333333));
            window.addEventListener('resize', onResize);
            document.getElementById('fileInput').addEventListener('change', loadFile);
            document.getElementById('canvas').addEventListener('click', onClick);
            document.addEventListener('keydown', onKeyDown);
            renderClassRows();
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            frameCount++;
            if (performance.now() - lastTime >= 1000) {
                document.getElementById('statFps').textContent = frameCount;
                frameCount = 0;
                lastTime = performance.now();
            }
        }

        function onResize() {
            const c = document.getElementById('canvas-container');
            camera.aspect = c.clientWidth / c.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(c.clientWidth, c.clientHeight);
        }

        function updateSegParams() {
            document.getElementById('segRadiusVal').textContent = document.getElementById('segRadius').value;
            document.getElementById('segMinPtsVal').textContent = document.getElementById('segMinPts').value;
            if (allPoints.length > 0) rebuildSegments();
        }

        function updateDisplay() {
            maxDisplayPoints = parseInt(document.getElementById('maxPoints').value);
            document.getElementById('maxPtsVal').textContent = (maxDisplayPoints / 1000) + 'K';
            if (allPoints.length > 0) createPointCloud(false);
        }

        function updatePointSize() {
            const size = parseFloat(document.getElementById('pointSize').value);
            document.getElementById('ptSizeVal').textContent = size;
            if (pointCloud) pointCloud.material.size = size;
        }

        function rebuildSegments() {
            if (allPoints.length === 0) return;
            const start = performance.now();
            buildSegments();
            document.getElementById('statSeg').textContent = Math.round(performance.now() - start) + 'мс';
            document.getElementById('statSegs').textContent = segments.length;
        }

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('info').innerHTML = 'Загрузка...';
            isFirstLoad = true;
            const reader = new FileReader();
            reader.onload = (ev) => {
                parsePoints(ev.target.result);
                rebuildSegments();
                document.getElementById('statTotal').textContent = allPoints.length.toLocaleString();
                document.getElementById('statDisplay').textContent = displayPoints.length.toLocaleString();
                document.getElementById('info').innerHTML = `<span class="highlight">${file.name}</span><br>${allPoints.length.toLocaleString()} точек`;
            };
            reader.readAsText(file);
        }

        function parsePoints(text) {
            allPoints = [];
            const lines = text.trim().split('\n');
            const sep = text.includes(',') ? ',' : /\s+/;
            for (let i = 0; i < lines.length; i++) {
                const p = lines[i].trim().split(sep);
                if (p.length >= 4) {
                    allPoints.push({ idx: i, class: parseInt(p[0]) || 1, x: parseFloat(p[1]), y: parseFloat(p[2]), z: parseFloat(p[3]), segment: -1 });
                }
            }
            let cx = 0, cy = 0;
            for (const p of allPoints) { cx += p.x; cy += p.y; }
            centerOffset.x = cx / allPoints.length;
            centerOffset.y = cy / allPoints.length;
            createPointCloud(true);
            renderClassRows();
        }

        function createPointCloud(resetCamera) {
            if (pointCloud) scene.remove(pointCloud);
            if (allPoints.length > maxDisplayPoints) {
                const step = Math.ceil(allPoints.length / maxDisplayPoints);
                displayPoints = allPoints.filter((_, i) => i % step === 0);
            } else {
                displayPoints = [...allPoints];
            }
            document.getElementById('statDisplay').textContent = displayPoints.length.toLocaleString();
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(displayPoints.length * 3);
            const col = new Float32Array(displayPoints.length * 3);
            for (let i = 0; i < displayPoints.length; i++) {
                const p = displayPoints[i];
                pos[i * 3] = p.x - centerOffset.x;
                pos[i * 3 + 1] = p.z;
                pos[i * 3 + 2] = p.y - centerOffset.y;
                const c = new THREE.Color(classColors[p.class] || 0xffffff);
                col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const size = parseFloat(document.getElementById('pointSize').value);
            pointCloud = new THREE.Points(geo, new THREE.PointsMaterial({ size, vertexColors: true, sizeAttenuation: true }));
            scene.add(pointCloud);

            // Сброс камеры только при первой загрузке
            if (resetCamera && isFirstLoad) {
                camera.position.set(50, 50, 50);
                controls.target.set(0, 0, 0);
                isFirstLoad = false;
            }
        }

        // Улучшенный Region Growing
        function buildSegments() {
            const radius = parseFloat(document.getElementById('segRadius').value);
            const minPts = parseInt(document.getElementById('segMinPts').value);
            const byClass = document.getElementById('segByClass').checked;
            const stopGround = document.getElementById('segStopGround').checked;
            const maxDZ = parseFloat(document.getElementById('segMaxDZ').value);
            document.getElementById('segMaxDZVal').textContent = maxDZ;
            const gridSize = radius * 2;
            const grid = new Map();

            // Построение пространственного индекса
            for (let i = 0; i < allPoints.length; i++) {
                const p = allPoints[i];
                const key = `${Math.floor(p.x / gridSize)},${Math.floor(p.y / gridSize)},${Math.floor(p.z / gridSize)}`;
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(i);
                allPoints[i].segment = -1;
            }

            function getNeighbors(idx) {
                const p = allPoints[idx];
                const neighbors = [];
                const gx = Math.floor(p.x / gridSize), gy = Math.floor(p.y / gridSize), gz = Math.floor(p.z / gridSize);
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dz = -1; dz <= 1; dz++) {
                            const cell = grid.get(`${gx + dx},${gy + dy},${gz + dz}`);
                            if (!cell) continue;
                            for (const j of cell) {
                                if (j === idx) continue;
                                const q = allPoints[j];
                                const d = Math.sqrt((p.x - q.x) ** 2 + (p.y - q.y) ** 2 + (p.z - q.z) ** 2);
                                if (d <= radius) neighbors.push(j);
                            }
                        }
                    }
                }
                return neighbors;
            }

            // Находим высоту грунта (класс 2) для ограничения
            let groundMinZ = -Infinity;
            if (stopGround) {
                const groundPoints = allPoints.filter(p => p.class === 2);
                if (groundPoints.length > 0) {
                    // Находим среднюю высоту грунта
                    let sumZ = 0;
                    for (const p of groundPoints) sumZ += p.z;
                    groundMinZ = sumZ / groundPoints.length;
                }
            }

            let segId = 0;
            segments = [];

            for (let i = 0; i < allPoints.length; i++) {
                if (allPoints[i].segment !== -1) continue;

                const seed = allPoints[i];
                const seedClass = seed.class;
                const seedIsGround = seedClass === 2;
                const stack = [i];
                const segment = [];

                while (stack.length > 0) {
                    const curr = stack.pop();
                    if (allPoints[curr].segment !== -1) continue;

                    const pt = allPoints[curr];
                    const currClass = pt.class;

                    // Если включена фильтрация по классу - проверяем
                    if (byClass && currClass !== seedClass) continue;

                    // Если включено "не ниже грунта" и начали НЕ с грунта:
                    // - не переходим на грунт (класс 2)
                    // - не берём точки ниже уровня грунта
                    if (stopGround && !seedIsGround) {
                        if (currClass === 2) continue;
                        if (pt.z < groundMinZ - 0.5) continue; // 0.5m допуск
                    }

                    allPoints[curr].segment = segId;
                    segment.push(curr);

                    const neighbors = getNeighbors(curr);
                    for (const n of neighbors) {
                        if (allPoints[n].segment === -1) {
                            const np = allPoints[n];
                            const nClass = np.class;

                            // Перепад высоты между текущей точкой и соседом
                            const dz = Math.abs(pt.z - np.z);

                            // Проверки для добавления соседа
                            let canAdd = true;

                            // Проверка класса
                            if (byClass && nClass !== seedClass) canAdd = false;

                            // Проверка грунта
                            if (stopGround && !seedIsGround) {
                                if (nClass === 2) canAdd = false;
                                if (np.z < groundMinZ - 0.5) canAdd = false;
                            }

                            // Проверка перепада высоты
                            if (dz > maxDZ) canAdd = false;

                            if (canAdd) stack.push(n);
                        }
                    }
                }

                if (segment.length >= minPts) {
                    segments.push(segment);
                    segId++;
                }
            }
        }

        function onClick(e) {
            if (!pointCloud) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(pointCloud);
            if (intersects.length > 0) {
                const displayIdx = intersects[0].index;
                const realIdx = displayPoints[displayIdx].idx;
                const segId = allPoints[realIdx].segment;
                if (!e.shiftKey) selectedIndices.clear();
                if (segId >= 0 && segments[segId]) {
                    for (const i of segments[segId]) selectedIndices.add(i);
                    updateColors();
                    document.getElementById('info').innerHTML = `Выделено: <span class="highlight">${selectedIndices.size.toLocaleString()}</span><br>Сегмент #${segId} (${segments[segId].length} точек)`;
                }
            }
        }

        function updateColors() {
            if (!pointCloud) return;
            const cols = pointCloud.geometry.attributes.color.array;
            for (let i = 0; i < displayPoints.length; i++) {
                const realIdx = displayPoints[i].idx;
                const c = selectedIndices.has(realIdx) ? new THREE.Color(0xffff00) : new THREE.Color(classColors[allPoints[realIdx].class] || 0xffffff);
                cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
            }
            pointCloud.geometry.attributes.color.needsUpdate = true;
        }

        function setTargetClass(cls) { targetClass = cls; renderClassRows(); }

        function applyClass() {
            if (selectedIndices.size === 0) return;
            const count = selectedIndices.size;
            for (const i of selectedIndices) allPoints[i].class = targetClass;
            selectedIndices.clear();
            rebuildSegments();
            createPointCloud(false); // Не сбрасывать камеру!
            renderClassRows();
            document.getElementById('info').innerHTML = `✓ ${count.toLocaleString()} → ${classNames[targetClass]}`;
        }

        function clearSelection() { selectedIndices.clear(); updateColors(); document.getElementById('info').innerHTML = 'Снято'; }

        function renderClassRows() {
            const counts = {};
            for (const p of allPoints) counts[p.class] = (counts[p.class] || 0) + 1;
            let html = '';
            for (const cls of [2, 3, 4, 5, 6, 7]) {
                html += `<div class="class-row class-${cls} ${cls === targetClass ? 'target' : ''}" onclick="setTargetClass(${cls})"><span>${cls}</span><span>${classNames[cls]}</span><span class="count">${(counts[cls] || 0).toLocaleString()}</span></div>`;
            }
            document.getElementById('classRows').innerHTML = html;
        }

        function onKeyDown(e) {
            if (e.key >= '2' && e.key <= '7') setTargetClass(parseInt(e.key));
            else if (e.key === 'Enter') applyClass();
            else if (e.key === 'Escape') clearSelection();
        }

        function saveFile() {
            if (!allPoints.length) return;
            let content = '';
            for (const p of allPoints) content += `${p.class} ${p.x.toFixed(3)} ${p.y.toFixed(3)} ${p.z.toFixed(3)}\n`;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([content]));
            a.download = 'edited_classified.xyz';
            a.click();
        }

        init();
    </script>
</body>

</html>
